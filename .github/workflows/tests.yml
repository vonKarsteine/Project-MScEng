name: tests

# The suite is hermetic by construction: no dataset, no checkpoints, no GPU and
# no network at test time. That is the point of the contract-test design, and CI
# is where it gets demonstrated rather than claimed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      # opencv-python links against libGL, which the runner image lacks.
      - name: System libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU wheels only: nothing in the suite touches CUDA.
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
          pip install nibabel onnx onnxruntime

      - name: Import without path manipulation
        run: python -c "import koa_multimodal; print(koa_multimodal.__version__)"

      - name: Contract tests
        run: pytest -q

      - name: Synthetic forward pass over every route
        run: koa check pipeline --synthetic

      - name: Dataset layout audit (tree is empty by design)
        run: koa check data --root data --allow-empty

      - name: Every pipeline stage resolves
        run: |
          for stage in 01_data 02_unimodal 03_fusion 04_oof 05_ensemble 06_deployment; do
            koa pipeline run "$stage" --dry-run > /dev/null
          done

      - name: Result records are valid and honestly pending
        run: koa records validate --all

      - name: Demo API starts
        run: koa serve --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
