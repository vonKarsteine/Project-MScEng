# Default configuration for the KOA multimodal package.
#
# Every key here maps to exactly one typed field in
# src/koa_multimodal/config/schema.py, and every field appears here. Both
# directions are asserted by tests/test_config.py, along with a check that each
# field has at least one reader -- a key nothing consumes is documentation
# pretending to be configuration.
#
# Symbols in comments match the dissertation. Values marked "thesis" are reported
# constants and should not be changed without also correcting the text.

[project]
name = "KOA_Multimodal_v7"
methodology_version = "chapter3_v2"
run_id = "run_001"

[data]
training_root = "data/training"
# The single source of truth: 8 columns, one row per (subject, knee) pair.
xray_index = "data/training/xray/index/pairs_00m.csv"

[input]
xray_size = 384                       # thesis: 384 x 384 x 1
mri_depth = 32                        # thesis: 32 x 384 x 384 x 2
mri_height = 384
mri_width = 384

[preprocessing]
xray_locator = "edge_intensity_knee_center_square_crop"
xray_clahe_clip_limit = 2.0           # thesis 4.1.3: clipLimit=2.0
xray_clahe_tile_grid_size = 8         # thesis 4.1.3: tileGridSize=(8,8)
# When true, a missing cv2 is a startup error instead of a silently skipped CLAHE.
xray_require_clahe = false
xray_normalization = "imagenet_grayscale"
xray_imagenet_gray_mean = 0.449
xray_imagenet_gray_std = 0.226
mri_dtype = "float32"
# thesis 4.1.3 describes a float32 volume cache at d32_h384_w384. Off by default
# because it costs ~1.1 MB per pair on disk; on, it removes a per-epoch decode.
mri_cache_enabled = false
mri_cache_root = "artifacts/cache/mri"
t2_clip_min = 0.0
t2_clip_max = 110.0                   # thesis: T2 clipped to [0, 110] then / 110
r2_clip_min = 0.0
r2_clip_max = 1.0                     # thesis: R2 bounded to [0, 1]

# Augmentation runs only on the train split and must be a bit-exact no-op
# elsewhere. ImageNet-gray normalisation is applied AFTER augmentation, because
# the X-ray augmenter clips to [0, 1].
[augmentation.xray]
random_resized_crop_scale = [0.82, 1.00]
random_resized_crop_ratio = [0.90, 1.10]
horizontal_flip_p = 0.5
rotation_degrees = 12.0
rotation_p = 0.85
affine_translate = 0.04
affine_scale = [0.95, 1.05]
intensity_brightness = 0.08
intensity_contrast = 0.12

[augmentation.mri]
horizontal_flip_p = 0.5
vertical_flip_p = 0.25
channel_scale = [0.92, 1.08]
channel_shift = [-0.03, 0.03]
gamma = [0.90, 1.10]
gaussian_noise_std = 0.015

[model]
num_classes = 5                       # KL0 - KL4
feature_dim = 64                      # thesis 4.1.4: common 64-D embedding
xray_pretrained = true
xray_pretrained_source = "ImageNet"
# §4.1.4 states the 3-D backbones stay randomly initialised.
mri_pretrained = false
mri_pretrained_source = "none_or_dataset_ssl"
profiles = [
  "fusion_cmodes_oof",
  "fusion_traditional_ensemble",
  "rckf_cv2_simsiam",
  "xray_cmodes_oof",
]

# Residual-Calibrated Kalman Fusion, §3.2.
[rckf]
prior_variance = 0.15                 # thesis: sigma_x^2
variance_floor = 0.05                 # thesis: R_floor
variance_ceiling = 2.0                # thesis: R_ceil
variance_groups = 1
residual_weight = 0.1                 # thesis: alpha_res, searched over {0.1, 0.2, 0.5}
# Softplus keeps the variance estimator monotone in the residual by construction.
# "gelu" is selectable for ablation only and voids that guarantee; the methodology
# text names GELU, and it is the text that needs correcting, not the code.
monotone_activation = "softplus"

# Calibrated Multimodal OOF Dynamic Ensemble Selector, §3.3.
# selector_tau and selector_switch_cost are absent on purpose: they are outputs of
# out-of-fold calibration and live in the selector checkpoint. They enter the rule
# only through their sum, so the identifiable parameter is tau_s + c_switch.
[cmodes]
default_candidate_id = "rckf"         # overridden per pool in configs/pools/*.toml
risk_probability = "nll"
risk_ordinal_weight = 1.0             # lambda in -log p(true) + lambda |y_hat - y| / 4
boundary_bins = [0.10, 0.30]
selector_hidden_dim = 64
selector_local_learning_rate = 0.001
selector_local_steps = 3
selector_rounds = 5
selector_server_learning_rate = 0.5
selector_beta1 = 0.9                  # thesis: FedYogi beta_1
selector_beta2 = 0.999                # thesis: FedYogi beta_2
selector_epsilon = 0.001              # FedYogi tau

[training]
environment = "koa_project"
device = "cuda:0"
precision = "fp32"                    # thesis 4.1.4: training used FP32 arithmetic
amp = false
seed = 42
epochs = 20                           # thesis Table 4.4: 20 epochs per candidate
optimizer = "AdamW"
learning_rate = 0.0001                # thesis Table 4.3: searched over [1e-5, 1e-4]
weight_decay = 0.0001
scheduler = "cosine"
warmup_epochs = 0
num_workers = 0
pin_memory = true
oof_folds = 3
oof_seed = 42
checkpoint_metric = "val_qwk"         # selection is on QWK, not accuracy
# Table 4.3 states a global batch size of 16. In practice MRI decode cost forces
# mri_batch_size = 1, and 4 x 4 accumulation reproduces the effective size.
xray_batch_size = 4
mri_batch_size = 1
fusion_batch_size = 4                 # must be >= 2: InfoNCE needs negatives
multimodal_gradient_accumulation = 4
contrastive_alignment_weight = 0.1    # lambda_align
# alpha_res lives in [rckf] as residual_weight -- one home per constant.
qat_kd_weight = 0.5                   # lambda_1
qat_boundary_weight = 0.2             # lambda_2
qat_ordinal_weight = 0.1              # lambda_3
qat_reliability_weight = 0.1          # lambda_4
qat_selector_weight = 0.1             # lambda_5
qat_temperature = 3.0                 # thesis: distillation temperature tau = 3.0
qat_margin_epsilon = 0.05
qat_selector_fallback_margin = 0.02

# Statistical validation, §3.5.
[statistics]
bootstrap_iterations = 2000           # thesis: B = 2000
bootstrap_seed = 7
bootstrap_alpha = 0.05                # 95% confidence intervals
cluster_by_subject = true             # a patient's two knees are not independent
