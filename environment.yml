# Declarative rebuild of the single conda environment this package targets.
#
# On the machine this package was developed on, `koa_project` already exists with
# the pinned stack below and only needs `pip install nibabel pytest onnxruntime`.
# This file is for reproducing the environment elsewhere.
#
# Versions match MScEng.pdf section 4.1.4 (Implementation Environment).
name: koa_project
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.9.25
  - pip
  - pip:
      # Chapter 4.1.4 pins torch 2.5.1 + CUDA 11.8 and torchvision 0.20.1.
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.5.1+cu118
      - torchvision==0.20.1+cu118
      # 4.1.4 reports timm 1.0.19; 1.0.24 is what is installed and is API-compatible
      # for every backbone this package builds. See DEPENDENCIES.md.
      - timm==1.0.24
      - numpy==2.0.2
      - Pillow==11.1.0
      - opencv-python==4.12.0.88
      - nibabel>=5.0
      - tomli>=2.0.1
      - pytest>=7.0
      # Optional [deployment] extra: the ONNX export path.
      - onnx==1.19.1
      - onnxruntime>=1.17
