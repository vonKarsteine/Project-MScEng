[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "koa-multimodal"
version = "7.0.0"
description = "Multimodal Kellgren-Lawrence knee osteoarthritis grading from paired X-ray and MRI (HKU DASE7099)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Academic use only" }
dependencies = [
  "numpy>=1.23",
  "Pillow>=9.0",
  "opencv-python>=4.7",
  "nibabel>=5.0",
  "torch>=2.5,<2.6",
  "torchvision>=0.20,<0.21",
  "timm>=1.0",
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
deployment = ["onnx>=1.15", "onnxruntime>=1.17"]

[project.scripts]
koa = "koa_multimodal.cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::koa_multimodal.core.errors.KoaWarning"]
